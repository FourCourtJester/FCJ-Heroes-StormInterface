<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon, shown in OBS's dock and source list. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230ea5e9'/%3E%3Crect x='3' y='5' width='10' height='6' rx='1' fill='%23f8fafc'/%3E%3C/svg%3E"
    />
    <!-- Shown while the studio loads. After that the title comes from `name` in
         src/studio/studio.js -- your studio for the board, and each graphic's own
         name beside it. -->
    <title>Loading…</title>
    <!-- The name plates are drawn in this (tools/obs.py writes it into namebar.css).
         Fetched at load: a studio on a machine with no network falls back to the
         system sans-serif, which fits differently. Self-host it here if that matters. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
