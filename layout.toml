# FCJH overlay — every number that places something on screen.
#
# Units are SCREEN PIXELS at the locked 1920 x 1080, straight off the agreed wireframe
# (https://claude.ai/artifact/6MmAcxcKjfAAprCN3oc3ZK). tools/gen.py converts them to
# layout units (the game lays out on a 1200-tall grid, so 1 unit = 0.9 px at 1080p).
# Every rect is anchored to the top-centre, bottom-centre or an edge of the screen, or to the
# piece it sits on (tools/gen.py ANCHORS), so a window that isn't 16:9 keeps it in place
# relative to that point; the numbers here are where things land at 1920 x 1080.
#
# Change a number, run `python tools/pack.py --wait`, leave and reopen the replay.

[meta]
name = "FCJH"
version = "1.0.2"

[screen]
width = 1920
height = 1080
ui_reference_height = 1200   # the game's layout grid height; fixed by the engine
# The viewport's padding: nothing comes closer to a screen edge than this, except the top bar
# (centred on the top edge) and Blizzard's minimap square. The hero rows grow to meet it
# ([hero_row] scale = "fit"); tools/gen.py refuses a build that breaks it. 20 px, and the
# plates at the size it gives them (user, 2026-10-05).
padding = 20

# Dev builds only. Release builds leave all of this out.
[dev]
build_stamp = [20, 20]       # x, y of the build stamp: top left, above the kill feed (top right
                             # until 2026-10-16, when the replay box took that corner)

# ---------------------------------------------------------------------------
# Minimap. Blizzard's minimap is a fixed square (438 layout units = 394 px); the engine
# fits each map's shape inside it, centred. Wide maps draw short, tall maps draw tall.
# Like Blizzard, we let the square hang below the screen edge so wide maps sit low.
# Each battleground moves it so the map, as drawn, sits with its bottom on the [screen] padding
# line, level with the plates' bottom (tools/maps.py works out each map's drawn size from the
# game files). `bottom` is for maps that don't move it (the ARAM maps).
# ---------------------------------------------------------------------------
[minimap]
centre_x = 960               # the square's horizontal centre
bottom = 1141                # the square's bottom edge; > 1080 hangs off-screen. The place of every map
                             # that doesn't move it: the older maps without own_place in
                             # tools/maps.py (Blackheart's Bay, Dragon Shire, Garden; Haunted Mines
                             # and Cursed Hollow have it - placed by Blizzard's map id) and the ARAM maps.
                             # Cursed Hollow is the BASELINE: 1141 is its approved place (2026-10-06:
                             # its map's bottom on the screen's edge). It has own_place since
                             # 2026-10-19 (its `across` needs a map that moves), its [minimap.nudge]
                             # keeping it at this height - change this and retune that. The others'
                             # bottoms land at 1061-1076, Haunted
                             # Mines' (380 px tall) 54 px off the bottom (user, 2026-10-09: no
                             # jitter - decide at its QA). Was 1133.
floor = 1065                 # THE FLOOR, every map (user, 2026-10-09): no map's VISUAL bottom edge -
                             # the map art's outline, not its texture box nor the unit icons hanging
                             # off it (but the map's own markers, a building's or a camp's: user,
                             # 2026-10-14, Tomb's cut off) - may sit lower than Cursed Hollow's, the baseline: measured at
                             # 1080p, its interior to 1063, its outline ~1065. Check it when tuning a
                             # map ([minimap.nudge]); the build doesn't (each map's art ends short of
                             # its texture box by its own amount: Cursed Hollow's by ~15 px).
alert_gap = 10               # THE GAP, every map (user, 2026-10-14): a neutral objective above the minimap
                             # (Alterac's cage, Hanamura's payload) sits with its hexagon's bottom this many px
                             # over the drawn map's top tip - the hexagon, not its lowest part: what hangs under it
                             # goes either side of the tip (user, 2026-10-15). Each such map's measure is tools/maps.py
                             # `above`; gen.py moves its panels to it (panel_nudges) - not [minimap.panel_nudge].

# px per map, added to where tools/maps.py puts it: + lowers that map, - raises it. For fine
# tuning in game; 0 = its drawn bottom on the padding line. An older map without own_place in
# tools/maps.py doesn't move (see [minimap] bottom): its must stay 0 - tune its objective pieces
# ([minimap.panel_nudge]). Given own_place, it moves here from the start, by its map id.
[minimap.nudge]
alterac_pass = 0
battlefield_of_eternity = 16  # down to the floor (2026-10-15): its map's visual bottom (the outline's flat south edge) 1049 -> 1065
blackhearts_bay = 0
braxis_holdout = 18          # down to the floor (user, 2026-10-09): its map's visual bottom 1047 -> 1065; the HUD rides along
cursed_hollow = 20           # its own place (own_place, 2026-10-19: its `across`) at [minimap] bottom's height, the baseline
dragon_shire = 0
garden_of_terror = 0
hanamura_temple = 18         # down to the floor (user, 2026-10-14): its map's visual bottom 1047 -> 1065; the objective rides along
haunted_mines = 34           # its whole map on the line (where it glides to when the mines open): its texture's opaque box is taller than the map - drawn, the mines' bottom was 34 above the line (2026-10-09)
infernal_shrines = 11        # down to the floor: its notch 1054 -> 1065. While the skull race shows it lifts
                             # out of the race's way ([minimap.lift]); was -39 for good (5099bf4), the floor's one exception
sky_temple = -29             # up to the floor (2026-10-15): its map's visual bottom (the south stub, off screen) ~1087 -> 1065;
                             # -22 read ~1071.5 (confirm pass, 2026-10-19, 15_40_04)
                             # (its top tip 788, its art 299 px tall); the temples ride along, at THE GAP (maps.py gap_parts)
tomb_of_the_spider_queen = 29 # down to the floor: its bottom marker (a building's, under the outline's ~1025) at
                             # ~1036 -> 1065. 40 put the outline there and cut the marker off (user, 2026-10-14)
towers_of_doom = 0
volskaya_foundry = 7          # down to the floor (user, 2026-10-15): its map's visual bottom (the outline's south stub) 1058 -> 1065
warhead_junction = 22         # down to the floor (user, 2026-10-15): its map's visual bottom (the outline's tip) 1043 -> 1065;
                             # the nuke counters beside it move out of its way (maps.py WARHEAD_COUNTERS_*)

# px per map that opens on part of its map (launch_cut in tools/maps.py): at load that part's
# bottom sits on the padding line, + lowers it. When the map opens in full it glides up to its
# [minimap.nudge] place and stays there.
[minimap.launch_nudge]
haunted_mines = 0            # the surface only, its bottom on the line; the mines below the screen (user, 2026-10-09)

# px per map that lifts its minimap out of a part's way while it shows (lifts in tools/maps.py):
# the minimap glides this far up from its [minimap.nudge] place, and back down when the part
# hides. The part stays put, where its panel hangs it with the map lifted.
[minimap.lift]
infernal_shrines = 50         # the skull race (counts' tops ~1032, crystal ~1012) covered the map's bottom on the
                             # floor: 50 up, its notch ~1015, cleared it (5099bf4; 60 too tall). Seen there for good first

# px per map: that map's objective panel (its counters, timers and banners), moved with the
# minimap as it sat round Blizzard's; + lowers it, - raises it.
[minimap.panel_nudge]
alterac_pass = 0             # placed by [minimap] alert_gap (was 10 down, user 2026-10-13)
battlefield_of_eternity = 0
blackhearts_bay = -30         # the doubloon counts' team line up to ~1070, level with Towers' (user, 2026-10-12:
                             # too low - the coins cut off by the screen's edge, their tops at 1052)
braxis_holdout = 24          # its zerg HUD above the map, 24 px down (user, 2026-10-09: 2, 2 more, then 20 once compacted)
cursed_hollow = -25          # the tribute counts' ravens ran off the bottom (user, 2026-10-06)
dragon_shire = -29           # its shrine markers' team line level with Towers' (~1070 at 1080p; user, 2026-10-09:
                             # off the screen at 0; -41 a bit high; -33 put the line at 1066)
garden_of_terror = -29       # the seed counts' team line up to ~1070, level with Blackheart's (user, 2026-10-12:
                             # the counts' tops at 1060, cut off by the screen's edge; Blackheart's at 1031)
hanamura_temple = 0          # placed by [minimap] alert_gap (26 here never moved it: maps.proxy_lines)
haunted_mines = -11          # the skull counts' skulls on the padding line, once the minimap has moved
                             # (user, 2026-10-09: they ran off the bottom; measured 8 px short, then the map's 34)
infernal_shrines = 20         # the skull counts' tops ~1050 (cut off by the edge) up to ~1031, as Garden's and Blackheart's -
                             # 19 up, and the minimap's 39 up taken back (it rides with it); the crystal rides with them.
                             # Counted with the map lifted: the race is pinned there ([minimap.lift])
sky_temple = 0
tomb_of_the_spider_queen = -58 # the gem counts on screen: their numbers' tops 1060 (cut off by the edge) up to ~1031, as
                             # Garden's - 29 up, and the minimap's 29 down taken back (seen at 1030 with -69 and 40)
towers_of_doom = 0
volskaya_foundry = 0
warhead_junction = 0

# ---------------------------------------------------------------------------
# Elements: rect = [x, y, width, height].
# kind: "ui"     drawn by the interface, always on
#       "obs"    left empty for OBS to fill
#       "demand" on demand, or temporary
# ---------------------------------------------------------------------------

# Top bar, blue side (inside out: level, logo, name, score). Red mirrors blue about x 960.
# OBS draws data only, never art (user, 2026-10-16): team names, logos, series score, the
# tournament's name, division and logo, and the game's bans - with one exception, the name
# plate, which is OBS's own art because only OBS knows whether a tournament has team logos
# (2026-10-18, docs/obs-topbar-handoff.md). The whole OBS band - the name and logo plates,
# the score pips, the ban tiles and the division / game tabs - is worked out from [top_bar]
# by tools/gen.py (top_bar_rects), so it can't drift from the level wings it meets; those
# places are in the constants as "obs" like the rest. Everything under the band's data that
# the interface draws - the tabs, the empty ban tiles - comes with the art pass.
[element.blue_level]
rect = [820, 8, 64, 50]      # 64 wide, was 80 (user, 2026-10-19: the OBS top bar, docs/obs-topbar-handoff.md):
                             # the wings 20 px shorter each, their outer ends at 779.8 / 1140.2
kind = "ui"
[element.blue_talent_lead]
rect = [814, 0, 76, 64]      # Blizzard's flame, behind the level plate of the team ahead (6 past it each side)
kind = "demand"

# Top bar, centre
[element.logo_plate]
rect = [892, 0, 136, 125]
kind = "ui"
[element.clock]
rect = [906, 128, 108, 32]
kind = "ui"
[element.event_logo]
rect = [922, 32, 68, 62]     # the tournament's logo, in the hexagon's middle (its centre 956, 63);
                             # event_mask.png masks it to the hexagon. The tournament's NAME has
                             # left the clock: it goes in a tab of its own, still to settle
                             # (user, 2026-10-19; docs/obs-topbar-handoff.md)
kind = "obs"

# Top bar, red side (inside out: level, logo, name, score)
[element.red_level]
rect = [1036, 8, 64, 50]
kind = "ui"
[element.red_talent_lead]
rect = [1030, 0, 76, 64]
kind = "demand"

# Around the edges
[element.replay]
rect = [1675, 14, 231, 153]  # Blizzard's ReplayPanel, 257 x 170 units (native 420 wide), in the
                             # top-right corner, its art [screen] padding from both edges; its
                             # tab (replay_collapsed) is flush in the corner (user, 2026-10-16;
                             # on red's row before, the inspect card's mirror, and narrowed then
                             # to clear red's map alerts).
                             # Its four buttons need 254 units (55 each, the ends 17 in); the
                             # rest is shared evenly between them (gen.py REPLAY_BUTTON_GAP): 1
                             # unit, so the ~9 px seen between buttons (each frame pads its box
                             # ~4 px) matches the ~9 px from the panel's edge to Pause.
                             # Was the right edge's middle 2026-10-06..16, native width.
art_inset = 6                # its glass art's outer line sits 6 px inside the frame on every side
                             # (measured in game, 2026-10-05)
kind = "ui"
[element.replay_collapsed]
rect = [1720, 0, 200, 24]    # hidden state: a slim tab flush in the screen's top-right corner
kind = "demand"
[element.kill_feed]
rect = [0, 104.4, 540, 300]  # Blizzard's, in its own place, not moved (user, 2026-10-05): top-left,
                             # under the party frame's top (150 - 34 units); rows grow right and
                             # down. Here only for the padding check and the canvas.
kind = "ui"
[element.info_pane]
rect = [20, 196, 546, 576]   # sized to the talents table: 23-unit margins either side of its
                             # rows (portrait at 23, last talent ending at 584 of 607 units: 549
                             # and the default-quest column, one talent cell, user 2026-10-16) and
                             # just tall enough for its ten 60-unit rows under the title band.
                             # The stats panes spread their rows to fill the same box.
kind = "demand"

[element.inspect]
rect = [20, 0, 300, 525]     # the inspect card (selected hero): tall and skinny, left column;
                             # cut to what it holds (tools/inspect_card.py H: 583 units)
above = "blue_xp"            # its bottom sits [screen] padding above blue's row (its y is worked out)
kind = "demand"
neutral_colour = "b4a5e6"    # the card's edge for a unit of neither team (a mercenary camp, a
                             # boss): a lighter purple (user, 2026-10-05); blue and red are the plates'.
                             # Anything not a hero gets a short card (tools/inspect_card.py H_SHORT)

# The operator's toggles (user, 2026-10-16): just the four we care about, each Ctrl+Shift and
# the thing's initial, none of them a Blizzard key (validate.py checks every key here and the
# info panes' against Blizzard's game hotkeys, and against each other). Each starts on.
# Ahli and Spazzo have dozens; Blizzard has none of these four that works for an observer.
[toggles]
replay = "Control+Shift+R"   # the replay box (Blizzard's toggle, FCJH_Replay). Blizzard gave it
                             # Ctrl+Shift+O, which the game's UI editor's Save All takes first
                             # (gamehotkeys.txt), so it never worked - nor Ahli's (user,
                             # 2026-10-16). Moving Save All off it with our own GameHotkeys.txt
                             # didn't load (2026-10-16). The box's tab says the key too.
chat = "Control+Shift+C"     # Blizzard's chat messages (FCJH_Toggles); Ahli's key too
inspect = "Control+Shift+I"  # the inspect card (inspect_card.py); off, it slides off screen left, as
                             # Ahli's does. Tried on Ctrl+I 2026-10-05 and dropped then.
names = "Control+Shift+N"    # the player names over the heroes' health bars (FCJH_Toggles)
# The HUD (FCJH_Toggles; user, 2026-10-25): Blizzard's own observer keys, taken over because
# theirs left our pop-ups, panes and inspect card on screen. hud hides the lot, top plate
# too; hud_lower all but the top plate. Blizzard had them the other way round (Ctrl+E kept
# the team names). Ctrl+E is also gamehotkeys' ReplayRestart, but Blizzard's layout key on it
# has always won in the observer (validate.py LAYOUT_OVER_HOTKEY).
hud = "Control+E"
hud_lower = "Control+Shift+E"

[info_pane]
title_height = 26            # the title band across the top of the pane
border = 2                   # the frame line around it
header_height = 22           # the stats panes' column headings, under the title
team_height = 24             # each team's band (name + team totals) above its five rows
# Each pane has its own hotkey and starts hidden; they share the one info_pane box, and
# opening one closes whichever is open. Ctrl+1-4 (user, 2026-10-05): Blizzard's own panes on
# Ctrl+1 / Ctrl+2 have their keys taken away (FCJH_Hidden), as Ahli does. Ctrl+4 was siege until it became
# Blizzard's XP Contribution (user, 2026-10-25).
hotkeys = { talents = "Control+1", kda = "Control+2", healing = "Control+3", xp = "Control+4" }
# The numbers panes' rows (KDA, healing, XP contribution; user, 2026-10-23: "zebra rows, Heroes
# palette"): a stripe behind every row in its team's tint, the two shades alternating, and a
# thin line in the team colour under each, as Blizzard's score screen. The stripes butt
# together, each row centred in its own. Colours are "alpha,r,g,b" over the pane's skin; the
# talents pane keeps Blizzard's observer grid. Take the table out for no stripes.
[info_pane.rows]
blue = ["215,18,36,84", "215,30,56,124"]     # first row's shade, then the next's: opaque enough to read over a bright map
red = ["215,46,10,44", "215,66,18,62"]
blue_line = "190,58,96,184"
red_line = "190,128,40,92"
line = 2                     # units, along each stripe's bottom
[element.centre_banners]
rect = [640, 196, 640, 78]   # Blizzard's; untouched, may shift on y
kind = "ui"
[element.system_alert]
rect = [634.5, 197, 648, 720] # Blizzard's "X paused the game. (N remaining)" box (SystemAlertPanel),
                             # its size (720 x 800 units); moved off the logo plate and clock (it sat
                             # at y 40) to 40 px under the clock (user, 2026-10-25: under the centre
                             # banners, 284, was "waaay too far down"), centred on our 958.5 (user,
                             # 2026-10-24: custom games, "99% of esports"). The panel is a list: the
                             # box takes its text's height from the top, drawn 3 px in (284 drew
                             # 287-392), so 197 puts the box at 200
kind = "demand"

# Bottom centre
[element.map_objectives]
rect = [745, 742, 430, 56]
kind = "demand"
[element.minimap]
rect = [765, 804, 390, 264]
kind = "ui"

# ---------------------------------------------------------------------------
# Hero row. Ten cells, reading 1-5 (blue, left to right) then 6-0 (red).
# ---------------------------------------------------------------------------
[hero_row]
# Each hero cell is Blizzard's IN-GAME top-bar cell, same art and stacking: neighbours
# overlap so the slanted frames interlock. The cell's shape lives in tools/gen.py (HeroCell);
# here it's only scaled and placed. At scale 1 a cell is 115 x 55 px and a row of five is
# 468 px wide; at 1.375, 158 x 76 and 644; at 1.5125, 175 x 83 and 707.
# The rows are placed by their INNER ends (beside the minimap) and their bottom edge, so a new
# scale grows them outward and upward; tools/gen.py works out their top and blue's left edge.
# 1.375 = the mock's +10% (user, 2026-09-29); 1.5125 = another +10% (user, 2026-09-30).
# "fit" (2026-10-05): as large as [screen] padding allows - the rows' outer ends (their XP
# bars) that far from the screen's sides, and their bottom edge that far from its bottom.
scale = "fit"
blue_right = 752             # where blue's row ends (cell 5's right)
red_left = 1168              # cell 6; cells 7-0 follow to the right (blue_right's mirror about 960; 1167 until 2026-10-19)
talent_popup_size = 40       # the pop-ups' square (talent icon, heal plus), straddling the cell's top edge; shows ~42 px with its border, as the talents pane's squares (user, 2026-10-02; was 44)

# Talent pop-ups (tools/gen.py talent_popups): the talent a player just picked, in the talent
# pane's team-coloured square, in the same spot and motion as the heal pop-ups (both from
# tools/gen.py popup_frame), drawn over them. It always plays out - no lock, no early exit
# on a death: it's important information for the commentators (user, 2026-09-30).
# Size: talent_popup_size above.
[talent_popup]
hold = 5.1                   # s fully shown (gone at 0.25 + hold + fade = 6.1 s, as the probe)
fade = 0.75                  # s to fade out at the end

# Heal pop-ups (tools/gen.py heal_popups): a green plus in a green square, in the talent
# pop-up's spot and motion, when a hero drops to `threshold` percent or less. Once per dip:
# it re-arms only on a healthy reading (above threshold) or a death, and a plate never fires
# twice within `lock` s however the health reading flickers. It leaves on its own after
# `hold` s (plus the fade), or fades out at once if the hero dies. Built on what nine probe
# rounds taught (2026-09-26..30): the hero's health percent is read as TEXT and flickers,
# and state logic mustn't wait on an animation-driven flag.
[heal_popup]
threshold = 25               # percent
clear_above = 30             # percent: a showing pop-up fades out at once above this (user polish, 2026-09-30)
hold = 2.75                  # s fully shown (the talent pop-up holds 5.35; user: heal lingered)
fade = 0.75                  # s to fade out at the end
death_fade = 0.35            # s to fade out when the hero dies
lock = 6.0                   # s after a pop-up fires before that plate can fire another (10 while it showed 6.1 s)
colour = "3cff5a"            # the plus and the border
shrink = 2                   # px smaller than the talent pop-up, same centre (user, 2026-10-02)
plus_scale = 1.2            # the plus art, drawn this much larger than the box (its art has a wide margin); 0.86 until 2026-09-30

# Top bar backplate (tools/gen.py top_backplate_texture): one texture behind Blizzard's
# hexagon - wings along the top edge out past each team level (element.blue_level /
# red_level), their ends climbing with the plates' lean, and the hexagon on its own neutral
# plate. Silver chrome rim; team colour strongest at the wings' outer ends, fading to a
# stock dark toward the hexagon; a hexagon lattice fading the same way. Variant C of the
# canvas study (user, 2026-09-30) - the look the rest of the UI will follow.
[top_backplate]
# Blizzard's hexagon frame (TopBarLogoOverlay) as it lands at 1920 x 1080, its outer edge
# measured at 6x from a screenshot, 2026-09-30: corners clockwise from top-left, screen px.
# Not regular - the top edge is wider than the bottom (a regular one left the padding thin
# at the top and uneven down the lower sides)
hexagon = [[920, 7.5], [990.8, 7.5], [1019.8, 63.3], [988.3, 119.2], [923.7, 119.2], [894.7, 63.3]]
padding = 4                  # the neutral plate round the hexagon
wing_margin = 6              # the wings run this far past the level plates' outer edges
# the plates' health bars' own blue and red (Blizzard's fill art, sampled in game 2026-09-30)
blue_colour = "5cbcec"
red_colour = "e75c79"
colour_alpha = 1.0
# how strong the colour is along each wing, [position, strength]: 0 beside the hexagon, 1 at
# the wing's outer end
fade = [[0, 0.0], [0.15, 0.0], [0.35, 0.45], [0.55, 0.85], [1, 1.0]]
stock = ["221930", "170f20"] # the dark the colour fades to (top, bottom)
plate = ["3a3350", "15101f"] # the hexagon's plate (top, bottom)
# chrome, top to bottom (stops 0, .35, .6, 1); the row frames' and the core bars' too
# ([row_frame]). One flat silver, the bottom rows' (user, 2026-10-18: "Replace the top chrome
# with bright"): the ramp it had (f4f6fb, aab3cc, 5b637f, c9d0e2) read as shadowed beside them.
rim = ["dfe3ed", "dfe3ed", "dfe3ed", "dfe3ed"]
rim_width = 2.5
sheen = 0.16                 # white across the top half
hex_px = 14                  # the lattice's hexagons, width on screen
lattice = 0.6                # the lattice's strength

# Colour-blind mode (the game's Options > Gameplay > Colorblind Mode; user, 2026-10-25). Blizzard's
# own colours for it (core gameui.stormlayout ColorBlindColors, heroesdata's Ally override):
# blue stays blue, red turns orange. Each team-coloured piece keeps its own saturation and
# brightness and takes this hue (tools/gen.py colour_blind), so these two set every piece: the
# top backplate, the core bars, the red plates, the inspect card's edge and the talent pop-up's
# square. The studio's toggle (variables.colourblind) uses the same two (tools/obs.py).
[colour_blind]
blue = "1487e9"              # Blizzard's Ally, colour-blind (0.08, 0.53, 0.9141)
red = "fe8a0e"               # Blizzard's Hostile, colour-blind (0.996, 0.5412, 0.055)
# Blizzard's plate art (HUD_TopBar_Team_HeroFrame_BG_*) has no orange or cyan version, so these
# teams' plates are recoloured in game (Colorize, as the kill log's portrait borders): the
# picture's light parts to `plate_light` of the team colour toward white, its dark to
# `plate_dark` of it. Blue's art is near enough Blizzard's colour-blind blue to keep.
plates = ["red"]
plate_light = 0.25
plate_dark = 0.30

# The OBS band along the top edge (docs/obs-topbar-handoff.md, agreed 2026-10-18): the team
# name plates with their logo plates, the series score's pips, the ban tiles and the division
# / game tabs. tools/gen.py (top_bar_rects) works every box out from the numbers here, so the
# interface's places and the OBS layer's can't drift apart: the band's inner end meets the
# level wings' outer ends, the name and logo plates share one seam, and the tabs hang off
# Blizzard's hexagon. Red mirrors blue about the screen's middle - except the two tabs, whose
# inner sides follow the hexagon, which sits 2.75 px left of it.
[top_bar]
height = 63.3                # the band, from the top edge: the level wings' height (the
                             # hexagon's side points), so the art matches them
name_left = 440              # blue's name plate, its outer end along the band's top edge. The
                             # box runs from there to the wing's end, the lean taking its
                             # bottom edge 34.2 px further in (so 440 -> 779.8 along the top)
seam = 707                   # where the name plate's rim and the logo plate's coincide, along
                             # the top edge: the logo plate is the band's inner 109.5 px, and
                             # with no logo the name plate runs on to the wing
pips = 4                     # the most pips a side (a best of 7); OBS draws as many as the
                             # series needs (user, 2026-10-19: more than 3 is the operator's call)
pip_band = 0.8               # a pip's hexagon, pointy-topped: this much of the band's height
pip_gap = 5                  # between two pips
pip_off_name = 14            # the first pip, off the name plate's outer slant. They fill from
                             # the name outward
bans = 3                     # ban tiles a side (optional: a toggle)
ban_tile = 32                # a tile, px across the band's top edge and px tall (it leans with
                             # the plates, so its bottom edge is 17.3 px further in)
ban_pitch = 38               # between two tiles
ban_drop = 5                 # the tiles' top, below the band
ban_inset = 5                # the innermost tile, in from the seam carried down the lean
outward = 1                  # the whole OBS band sits this far outside its geometric place,
                             # each side away from the middle. The interface draws its chrome
                             # CENTRED on the level wing's edge, so half of it (1.25 px) falls
                             # outside the wing - on the band's ground. Without this the band's
                             # inner end runs under that chrome (user, 2026-10-22: "nudge blue
                             # left 1px and red right 1px"). Everything hung off the band moves
                             # with it: the logo plate, the seam, the pips, the ban tiles and
                             # the tabs' outer sides. The tabs' inner sides stay on the hexagon,
                             # so the two tabs grow by this much instead of moving
# The two marks in the top corners: the broadcaster's on the left, the tournament's WIDE
# logo on the right (user, 2026-10-23). The room is whatever a best of 7 leaves - its
# outermost pip is the furthest anything on the band reaches - so the box is derived from the
# pip row rather than typed, and a shorter series simply leaves more air.
corner_h = 50                # a corner mark's height
corner_gap = 18              # its inner edge, off the outermost pip a best of 7 draws

tab_clear = 5                # the division / game tabs' inner sides, off Blizzard's hexagon.
                             # They hang from the band to the ban tiles' bottom (y 100.3), and
                             # their outer sides are the seam carried down, so the slants line up

# The standby screen's "coming up next" band: the browser source between games
# (studio/src/sources/Standby.jsx). OBS-only, like [top_bar] - the interface draws none of it.
# The composition is the old NGS board (C:\FourCourtJester\Broadcasts\Heroes,
# apollo/scenes/scene-afk, 2018): two team containers meeting in the middle, a message board
# behind them, a logo arm at each screen edge. Its places, this kit's language - our lean, rim,
# lattice and team colours instead of its 45 degree chevrons and flat navy.
[standby]
band = 215                   # the whole assembly, up from the bottom edge of the screen
team_w = 576                 # a team's container, and
team_h = 130                 # ...its height. Both ends come to a point at HALF height - the
                             # plates' lean, carried over from the game band - so the two lean
                             # into each other across the middle
team_inset = 331             # a container's outer end, in from its own side of the screen.
                             # With the width, that leaves 106 px in the middle for the VS
team_bottom = 34             # the container's bottom edge, up from the bottom of the screen
team_cap = 44                # its nine-slice caps: wide enough to hold the point (lean *
                             # team_h / 2 = 35.1 px) with room for the rim inside it
plate_w = 686                # the message board behind them, carrying the line of text
plate_h = 156                # ...pointed the same way, but in plain smoke: it recedes, and the
plate_bottom = 59            # containers are the furniture (as the old board had it)
plate_text = 37              # the message, cap height. It sits in the board's top edge, the
                             # containers covering the rest
arm_w = 576                  # a logo arm, flush to its own screen edge
arm_h = 103
arm_bottom = 53
arm_over = 170               # how far an arm hangs off its own edge of the screen. The old
                             # board did this (apollo .logos left:-170) and it is what leaves a
                             # gap between the arm and the message board: butted up against it
                             # the three read as one letterbox bar across the bottom
arm_pad = 10                 # clear air between a logo and every edge of its arm - the
                             # screen edge, the top and bottom, and the diagonal. The logo
                             # takes whatever is left and is centred in it, rather than
                             # being a fixed width that could touch (user, 2026-10-23)
bug_w = 566                  # the countdown, hanging from the TOP edge of the screen, where
bug_h = 59                   # the old broadcast's timer bug hung (apollo/scenes/bug-timer)
smoke = 0.5                  # how black the message board and the arms are over the slideshow
bug_smoke = 0.25             # the bug is lighter: it sits over the picture, not under the band

# The webcam frames: a browser source of BORDERS, not of video (studio/src/sources/Webcams.jsx).
# OBS puts each camera underneath and this draws the frame and the name over it, which is the
# way round that lets a camera be moved and scaled without re-cutting any art (user, 2026-10-22).
# The windows are cut at the plates' angle, so they are not rectangles and OBS cannot crop to
# them on its own - tools/obs.py writes a mask per side for its Image Mask/Blend filter.
#
# They hang in the standby screen's free middle, between the countdown bug and the band, so the
# two sources stack in OBS without either moving.
[webcam]
w = 848                      # a cam window. Grown by about the 40 px asked for (user,
h = 477                      # 2026-10-23) and still exactly 16:9, which is what every camera
                             # and capture card gives. 848 x 477 is the nearest exact pair
                             # above 800 x 450; 832 x 468 is the nearest below. Both numbers
                             # have to stay whole: the OBS mask is a PNG drawn at this size
gap = 80                     # between the two windows
chamfer = 0.25               # the cut corner, measured DOWN as a FRACTION of the window's
                             # height; its width is the plates' lean over that run. A fraction
                             # and not a length, so every window is the same SHAPE whatever
                             # its size - which is what lets one mask serve them all, scaled
                             # in OBS (user, 2026-10-23). The angle survives either way, both
                             # boxes being 16:9, but only similar shapes survive a resize.
                             # A full parallelogram would slant far enough to lose most of a
                             # face, which is why this is a chamfer and not a lean
rim = 4                      # the chrome line round a window. Thicker than the plates' 2.5,
                             # because this one is read across a whole screen
plate_h = 56                 # the name bar under a window: the band's message board at its
plate_gap = 14               # own size - smoke, pointed ends, no chrome of its own
plate_pad = 22               # the name and the handle, in from the bar's points
plate_smoke = 0.8            # how black a name bar is. Darker than the standby band's 0.5,
                             # and the two match on screen BECAUSE of it: the band sits at the
                             # bottom, under the full weight of that screen's vignette, and
                             # these sit mid-screen where it has barely begun. Same alpha
                             # would read two different depths (user, 2026-10-23)
solo_w = 1024                # the one-camera layout: a single window, centred, bigger because
solo_h = 576                 # it has the screen to itself. 16:9 exactly, like the pair
name = 30                    # the commentator's name, cap height
social = 20                  # ...and their handle, under the same bar at the other end

# The scores screen: the browser source over Blizzard's end-of-game Stats screen
# (studio/src/sources/Scores.jsx). OBS-only.
#
# One thing survives on that screen and it is the stats panel; everything else - the title, the
# caster's own gold, gems and account level top right, the Leave and Rename Replay buttons, the
# chat and its channel joins - is ours to replace (user, 2026-10-23: "preserve that stats
# center box; everything else gets replaced"). So this is a backdrop with a hole in it.
#
# Measured off design/ref_endgame_stats.jpg: Blizzard's frame runs x 337-1583, y 207-924. The
# hole is a shade larger, so their frame and its glow survive rather than being clipped by ours.
# A JPEG, so these are +/-2 px; the real numbers want the extracted UI, as the top bar's did.
# The MATCHUP SLAB: a centred composition for the matchup, explored alongside the bottom
# band (user, 2026-10-25: "something more central, with team logos ... maybe different shapes
# for the visual containers to accommodate those logos").
#
# What is wrong with the band it replaces, in numbers: a team container is 576 x 130 carrying
# one line of text, where the in-game name plate carries the same thing in 374 x 63 - three
# times the area for identical content. And the two logo arms spend 1152 px, 60% of the
# screen's width, on event branding at the extreme edges while the teams get the middle. So
# the teams come to the centre and take a logo, and the two arms collapse into one lockup.
#
# It is free to leave the bottom edge because Draft will get its own version rather than
# sharing this one (user, 2026-10-25: "We dont have to use Draft in consideration").
[matchup]
centre_y = 500               # the team row's centre line. Above the screen's own 540: the eye
                             # reads centre a little high, and the lockup below balances it
badge = 220                  # a team's logo badge, a POINTY-TOP HEXAGON this tall. The kit is
                             # hexagonal already - the pips, the lattice inside every plate,
                             # Blizzard's own centrepiece - so a hexagon is where a logo
                             # belongs, and a plate pointed at both ends is not.
                             #
                             # Grown from 184 (user, 2026-10-25: "grow the badge so the logo
                             # has more presence"). A hexagon tapers, so the logo gets the
                             # largest square that fits inside it rather than the whole box -
                             # 184 left it at 87px, which read small; 220 gives 110. Taller
                             # again starts to overpower the name plate, which is 120
# The logo COVERS the badge and the hexagon clips it (user, 2026-10-25), so there is no
# padding here any more: a mark bleeds to the rim instead of sitting in a square inside it.
# Its rim and sheen are the plates' own, generated into badge_hex.svg - no rim width here
# either, because the kit already has one ([visual] rim_w) and a second would drift.
name_w = 440                 # the name plate: a FLAT outer edge butted to the badge, and a
                             # point at the VS end (user, 2026-10-25: "flatten the outer edges
                             # of the nameplates to match the vertical edge of the team logo
                             # hexagons"). Its height is not here - it is the hexagon's own
                             # vertical edge, badge / 2, so the two meet exactly instead of
                             # one overhanging the other by a few pixels
name_cap = 44                # its nine-slice caps, wide enough to hold the point
name_text = 46               # a team name's cap height, the size it starts at
name_lines = 2               # the most lines it may wrap to
name_min = 26                # ...and the floor it may shrink to once it has used them. The
                             # framework's own `fit` cannot do this: it guarantees one line by
                             # shrinking, measured at 23.8px for a 25-character club name -
                             # 48% of the 46 it was asked for, which is what made the old
                             # container look empty (user, 2026-10-25)
name_pad = 18                # the text, in from the plate's point
# THE ONE-CONTAINER TEAM (user, 2026-10-25: "the one container idea might be best"). One
# shape a side, holding everything that side is: the score at its outer end, a parallelogram
# for the logo next to it - the game scene's logo plate, in this kit's lean - and the name
# running in to the VS. The container keeps the name plate's own edges, flat outside and
# pointed in, so nothing bulges out of it and there is no head-and-shaft left to read.
#
# It is also where the series score finally lands: the space between the logo and the outer
# border was going spare, and a score retrofitted later would have meant moving everything.
unit_h = 140                 # the container, taller than the 110 plate it replaces because it
                             # now holds a logo rather than standing beside one
unit_score = 86              # the score panel at the outer end
unit_score_text = 56         # the number in it
unit_logo = 220              # the logo parallelogram beside it. The logo FILLS it and the
                             # slant clips the overflow, the way the game scene's logo plate
                             # works (user, 2026-10-25), so this is simply how much plate the
                             # mark gets. Width still has to clear the SHEAR: a parallelogram
                             # leans by lean * height - 75.6 at this height - and much under
                             # 200 reads as a diagonal strip rather than a plate
unit_rule = 2                # the hairline between the container's three parts

vs = 116                     # the VS hexagon between them, this tall
vs_gap = 22                  # between a name plate's inner point and the VS. Tight on
                             # purpose (user, 2026-10-25): the plate's point is a triangle,
                             # so the air it leaves beside the hexagon reads wider than the
                             # number. Narrowing it pulls the whole slab in with it, since
                             # everything is placed outward from the middle
vs_text = 38
kicker = 34                  # "Coming up next", on a plate above the matchup
kicker_w = 560               # the plate's TOP edge. One slant a side, not a point at half
kicker_h = 76                # height: the left edge runs down-left and the right down-right,
                             # so the plate flares to meet the matchup under it (user,
                             # 2026-10-25). The flare is the kit's lean over its height, and
                             # the bottom edge is kicker_w + 2 * that

# The plate's bottom edge sits ON the name plates' top edge, and the same translucent black
# carries down behind the row, so the kicker, the plates and the VS read as one shape rather
# than three things stacked near each other (user, 2026-10-25: "add the same translucent
# black to the mid so that it looks like one unit"). The mid is as wide as the plate's bottom,
# which is what makes the two read as one column.
lockup = 72                  # the broadcaster x tournament lockup, below the matchup
lockup_gap = 12              # up again, and again (user, 2026-10-25: "move the logos up a
                             # tad more"): close enough to read as the foot of the unit
                             # rather than something sitting under it
lockup_pad = 14              # air inside its own box, so the marks do not meet its edges
lockup_x = 42                # the x joining the two marks
lockup_mark = 330            # each mark's box, as the scores screen's
smoke = 0.55                 # how black a plate is over the slideshow

[scores]
panel_x = 335                # the hole, from the left edge of the screen
panel_y = 205                # ...and from the top
panel_w = 1250               # Blizzard's frame is 1246 wide, their glow a little more
panel_h = 722                # ...and 718 tall

# What stands around the hole. The bands left over are 1920x205 above the panel and 1920x153
# below it, and these are measured into them (user, 2026-10-23: "Winning team name across the
# top, white glowing in team color. The logos can be centered under the scores").
win_text = 72                # the winning team's name, across the top band
win_track = 6                # letter-spacing: a name this size needs air between the letters
win_glow = 30                # the glow's radius, in the winning team's colour
mark_h = 96                  # the two marks under the panel, in the bottom band's 153
mark_w = 320                 # ...capped, so one wide logo cannot crowd the other out
mark_pad = 10                # a logo never touches its container, as the band's arms

# The two marks read as a collaboration - <broadcaster> x <tournament> - so they close on a
# white x at the centre rather than sitting apart (user, 2026-10-23). The left one is right
# bound and the right one left bound, so both hug it.
x_text = 54                  # the x itself
x_gap = 34                   # its air, either side

# The winning team's name wears a laurel branch either side (user, 2026-10-25: "Just go
# laurels"). A hexagon version was drawn alongside it and dropped unused.
win_mark_h = 88              # taller than the name's 72, so it frames rather than sits in line
win_mark_gap = 30            # between a mark and the name
win_mark_colour = "2f8f4e"   # deep laurel green (user, 2026-10-25: "since you know, they're
                             # laurels"). Light enough to read against the nebula, which a
                             # true bottle green does not

# A comet must not cross the lit floor at the bottom of the backdrop - it reads as a streak
# ON the ground rather than in the sky (user, 2026-10-23). They fade out over this many px
# ending at the panel's bottom edge, which is where the horizon sits.
comet_fade = 180

# Bars stacked on each hero row, placed by tools/gen.py from [hero_row] so they follow it.
# Both are cut to the plates' slant: their ends continue the row's slanted outer edges.

# Team XP: on the plates' top edge, the full width of that edge.
[team_xp]
height = 8                   # the bar
gap = 1                      # between the bar and the plates' top edge (tight: one unit with the plates)
colour = "9a6cff"            # the fill, both teams (hex RGB)
track_colour = "0b0c14"      # the empty part
track_alpha = 220

# The XP and core bars' fills, bevelled as Blizzard's core bar (design/ref_default_core_hp.png;
# gen.py bevel_texture): lit from above, a soft step at mid-height. Brightness is x the bar's
# colour; lip and foot are texels at 1440p (1 texel ~ 0.75 px at 1080p). Take the table out
# for flat fills.
[bar_bevel]
top = 1.00                   # brightness at the top (the colour itself: 3f8cff and ff4a5e are full in one channel)...
bottom = 0.78                # ...falling to this at the bottom
step = 0.06                  # and dropping this much more below mid-height: the bevel
lip = 1                      # a light line along the top
lip_white = 0.35             # its mix toward white
foot = 1                     # a dark line along the bottom
foot_dark = 0.45             # its brightness

# A team's map alerts: stacked on its side of the minimap, on its plates' inner end (tools/maps.py).
[map_alerts]
above_core = 10              # px from the core bar's top up to every banner's bar's bottom: one place
                             # on every map, whether the core bar shows or not (user, 2026-10-09:
                             # the core bar is taller than any pop-up; what hangs under a bar is
                             # ignored - the banners draw over the pop-ups). Across, the art starts
                             # (red) or ends (blue) where its team's row does: [hero_row] red_left,
                             # blue_right

# Core health: on top of the XP bar, at the row's inner end (toward the minimap). Its size
# is Blizzard's (237 x 27 units = 213 x 24 px, 39% of the XP bar), fixed; Blizzard shows it
# only when a core is taking damage.
[team_core]
gap = 1                      # between core and XP
blue_colour = "3f8cff"
red_colour = "ff4a5e"
track_colour = "0b0c14"
track_alpha = 220
# Its own chrome line (user, 2026-10-16), as the row frame's ([row_frame]: the rim colours,
# rounded outside corners), round the core bar alone, so it shows only with the core bar.
# frame_width = 0 takes it away.
frame_width = 3              # the line, px: 3 like the rest (user, 2026-10-16); its bottom line then
                             # lies exactly on the row frame's top line ([row_frame], 2 out of the XP bar)
frame_inside = 1             # of which over the bar's edges (the rest outside)

# A chrome frame round each team's row (user, 2026-10-16): one line round the plates and the XP
# bar together (the XP bar's top down to the plates' bottom, both slanted ends), not the core
# bar, no lines between heroes. In the top backplate's rim colours ([top_backplate] rim, one
# flat silver), anti-aliased the same way; its outside corners rounded. Rows of 1-4 heroes get their own
# (FCJH_RowPacker). The part outside the plates counts against [screen] padding, so the rows sit
# that much higher and narrower; width = 0 takes the frame away and puts them back.
[row_frame]
width = 3                    # the line, px
inside = 1                   # of which over the plates' and the XP bar's edges (the rest outside)
end_inside = 1.5             # ...but along the row's two slanted ends: as the seam's half, so the
                             # outer plates' fountains sit as far from the ends as the others from
                             # their seams (at 1, ~1-1.5 px more black there: user, 23_25_09). The
                             # outset stays, so nothing stacked on the frame moves
fountain_gap = 1.5           # the black between each slanted line and its plate's fountain frame,
                             # px across the slant, as the game draws them: each line beside a
                             # fountain follows it (fountain_lines; at the exact places both teams'
                             # outer two plates had ~1 px more than the other three: 23_42_43)
seam = 3                     # a line along each slant between two plates, centred on it (1 px of each
                             # plate and 1 between: it hides the slants' rough edges), px; 0 = none.
                             # The same line runs under the XP bar, centred on its gap to the plates,
                             # so the bar is fully enclosed (user, 2026-10-16)
# its colours: [top_backplate] rim's, so top and bottom can't drift apart (a `rim` here would
# be this frame's own). Flat since 2026-10-17: the backplate's old ramp put its dark band - read
# as a shadow - part way down every seam; the top followed 2026-10-18.
