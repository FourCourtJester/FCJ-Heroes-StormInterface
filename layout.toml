# FCJH overlay — every number that places something on screen.
#
# Units are SCREEN PIXELS at the locked 1920 x 1080, straight off the agreed wireframe
# (https://claude.ai/artifact/6MmAcxcKjfAAprCN3oc3ZK). tools/gen.py converts them to
# layout units (the game lays out on a 1200-tall grid, so 1 unit = 0.9 px at 1080p).
#
# Change a number, run `python tools/pack.py --wait`, leave and reopen the replay.

[meta]
name = "FCJH"
version = "0.1.0"

[screen]
width = 1920
height = 1080
ui_reference_height = 1200   # the game's layout grid height; fixed by the engine

# Dev builds only. Release builds leave all of this out.
[dev]
build_stamp = [16, 936]      # x, y of the build stamp
wireframe_overlay = true     # outline every element's wireframe box in game, to build against
overlay_alpha = 200          # 0-255
overlay_line = 2             # outline thickness
overlay_hotkey = "Control+Shift+W"   # shows / hides the overlay

# ---------------------------------------------------------------------------
# Minimap. Blizzard's minimap is a fixed square (438 layout units = 394 px); the engine
# fits each map's shape inside it, centred. Wide maps draw short, tall maps draw tall.
# Like Blizzard, we let the square hang below the screen edge so wide maps sit low.
# ---------------------------------------------------------------------------
[minimap]
centre_x = 960               # the square's horizontal centre
bottom = 1133                # the square's bottom edge; > 1080 hangs off-screen

# ---------------------------------------------------------------------------
# Elements: rect = [x, y, width, height].
# kind: "ui"     drawn by the interface, always on
#       "obs"    left empty for OBS to fill
#       "demand" on demand, or temporary
# ---------------------------------------------------------------------------

# Top bar, blue side (outside in: score, name, logo, level)
[element.blue_score]
rect = [416, 8, 68, 50]
kind = "obs"
[element.blue_name]
rect = [490, 8, 240, 50]
kind = "ui"                  # the plate is ours; OBS draws the name on it
[element.blue_logo]
rect = [736, 8, 58, 50]
kind = "obs"
[element.blue_level]
rect = [800, 8, 80, 50]
kind = "ui"
[element.blue_talent_lead]
rect = [794, 0, 92, 64]      # Blizzard's flame, behind the level plate of the team ahead
kind = "demand"
[element.blue_bans]
rect = [622, 64, 108, 32]
kind = "obs"
[element.bracket]
rect = [736, 64, 148, 24]
kind = "obs"

# Top bar, centre
[element.logo_plate]
rect = [892, 0, 136, 125]
kind = "ui"
[element.clock]
rect = [906, 128, 108, 32]
kind = "ui"

# Top bar, red side (inside out: level, logo, name, score)
[element.red_level]
rect = [1040, 8, 80, 50]
kind = "ui"
[element.red_talent_lead]
rect = [1034, 0, 92, 64]
kind = "demand"
[element.red_logo]
rect = [1126, 8, 58, 50]
kind = "obs"
[element.red_name]
rect = [1190, 8, 240, 50]
kind = "ui"
[element.red_score]
rect = [1436, 8, 68, 50]
kind = "obs"
[element.red_bans]
rect = [1190, 64, 108, 32]
kind = "obs"
[element.game_count]
rect = [1036, 64, 148, 24]
kind = "obs"

# Around the edges
[element.replay]
rect = [16, 12, 378, 153]    # Blizzard's ReplayPanel, native 420 x 170 units
kind = "ui"
[element.replay_collapsed]
rect = [16, 0, 200, 24]      # hidden state: a slim tab on the top edge
kind = "demand"
[element.kill_feed]
rect = [1364, 96, 540, 300]  # right edge 1904: where each kill's portraits end (rows right-aligned)
kind = "ui"
[element.info_pane]
rect = [16, 196, 494, 576]   # sized to the talents table: 23-unit margins either side of its
                             # rows (portrait at 23, last talent ending at 526 of 549 units) and
                             # just tall enough for its ten 60-unit rows under the title band.
                             # The stats panes spread their rows to fill the same box.
kind = "demand"

[element.inspect]
rect = [16, 196, 300, 750]   # the inspect card (selected hero): tall and skinny, left column;
                             # its bottom (946) clears the blue core bar and plates
kind = "demand"

[info_pane]
title_height = 26            # the title band across the top of the pane
border = 2                   # the frame line around it
header_height = 22           # the stats panes' column headings, under the title
team_height = 24             # each team's band (name + team totals) above its five rows
# Each pane has its own hotkey and starts hidden; they share the one info_pane box, and
# opening one closes whichever is open.
hotkeys = { talents = "Control+Shift+1", kda = "Control+Shift+2", healing = "Control+Shift+3", structures = "Control+Shift+4" }
[element.centre_banners]
rect = [640, 196, 640, 78]   # Blizzard's; untouched, may shift on y
kind = "ui"

# Bottom centre
[element.map_objectives]
rect = [745, 742, 430, 56]
kind = "demand"
[element.minimap]
rect = [765, 804, 390, 264]
kind = "ui"

# ---------------------------------------------------------------------------
# Hero row. Ten cells, reading 1-5 (blue, left to right) then 6-0 (red).
# ---------------------------------------------------------------------------
[hero_row]
# Each hero cell is Blizzard's IN-GAME top-bar cell, same art and stacking: neighbours
# overlap so the slanted frames interlock. The cell's shape lives in tools/gen.py (HeroCell);
# here it's only scaled and placed. At scale 1 a cell is 115 x 55 px and a row of five is
# 468 px wide; at 1.25, 144 x 68 and 583; at 1.375, 158 x 76 and 644.
# 1.375 = the mock's +10% (user, 2026-09-29): the rows grow outward from the minimap, keeping
# their inner ends (blue ends at 752, red starts at 1167) and their bottom edge (1068).
scale = 1.375
top = 993                    # the row's top edge
blue_left = 108              # cell 1; cells 2-5 follow to the right
red_left = 1167              # cell 6; cells 7-0 follow to the right
talent_popup_size = 40       # the talent's icon, straddling the cell's top edge
heroic_token = [24, 18]      # w, h px: the heroic token in the plate's bottom corner (widen to taste)

# Team level: Blizzard's level number, moved to the top edge (element.blue_level /
# red_level), on a hexagon-pattern backdrop in the team colour that fades away from the
# centre hexagon (after Blizzard's old level wings). Placeholder until the OBS package.
[team_level]
blue_colour = "3f8cff"
red_colour = "ff4a5e"
alpha = 230
hex_px = 14                  # the hexagons' width on screen

# Bars stacked on each hero row, placed by tools/gen.py from [hero_row] so they follow it.
# Both are cut to the plates' slant: their ends continue the row's slanted outer edges.

# Team XP: on the plates' top edge, the full width of that edge.
[team_xp]
height = 8                   # the bar
gap = 1                      # between the bar and the plates' top edge (tight: one unit with the plates)
colour = "9a6cff"            # the fill, both teams (hex RGB)
track_colour = "0b0c14"      # the empty part
track_alpha = 220

# Core health: on top of the XP bar, at the row's inner end (toward the minimap). Its size
# is Blizzard's (237 x 27 units = 213 x 24 px, 39% of the XP bar), fixed; Blizzard shows it
# only when a core is taking damage.
[team_core]
gap = 1                      # between core and XP
blue_colour = "3f8cff"
red_colour = "ff4a5e"
track_colour = "0b0c14"
track_alpha = 220
