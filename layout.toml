# FCJH overlay — every number that places something on screen.
#
# Units are SCREEN PIXELS at the locked 1920 x 1080, straight off the agreed wireframe
# (https://claude.ai/artifact/6MmAcxcKjfAAprCN3oc3ZK). tools/gen.py converts them to
# layout units (the game lays out on a 1200-tall grid, so 1 unit = 0.9 px at 1080p).
# Every rect is anchored to the top-centre, bottom-centre or an edge of the screen, or to the
# piece it sits on (tools/gen.py ANCHORS), so a window that isn't 16:9 keeps it in place
# relative to that point; the numbers here are where things land at 1920 x 1080.
#
# Change a number, run `python tools/pack.py --wait`, leave and reopen the replay.

[meta]
name = "FCJH"
version = "0.1.0"

[screen]
width = 1920
height = 1080
ui_reference_height = 1200   # the game's layout grid height; fixed by the engine
# The viewport's padding: nothing comes closer to a screen edge than this, except the top bar
# (centred on the top edge) and Blizzard's minimap square. The hero rows grow to meet it
# ([hero_row] scale = "fit"); tools/gen.py refuses a build that breaks it. 20 px, and the
# plates at the size it gives them (user, 2026-10-05).
padding = 20

# Dev builds only. Release builds leave all of this out.
[dev]
build_stamp = [20, 20]       # x, y of the build stamp: top left, above the kill feed (top right
                             # until 2026-10-16, when the replay box took that corner)

# ---------------------------------------------------------------------------
# Minimap. Blizzard's minimap is a fixed square (438 layout units = 394 px); the engine
# fits each map's shape inside it, centred. Wide maps draw short, tall maps draw tall.
# Like Blizzard, we let the square hang below the screen edge so wide maps sit low.
# Each battleground moves it so the map, as drawn, sits with its bottom on the [screen] padding
# line, level with the plates' bottom (tools/maps.py works out each map's drawn size from the
# game files). `bottom` is for maps that don't move it (the ARAM maps).
# ---------------------------------------------------------------------------
[minimap]
centre_x = 960               # the square's horizontal centre
bottom = 1141                # the square's bottom edge; > 1080 hangs off-screen. The place of every map
                             # that doesn't move it: the older maps without own_place in
                             # tools/maps.py (Cursed Hollow, Blackheart's Bay, Dragon Shire, Garden;
                             # Haunted Mines has it - placed by Blizzard's map id) and the ARAM maps.
                             # Cursed Hollow is the BASELINE: this is its place, so it never needs
                             # own_place (user, 2026-10-09) - change this and it moves too. 1141 is
                             # Cursed Hollow's approved place (2026-10-06: its map's bottom on the
                             # screen's edge); the others' bottoms land at 1061-1076, Haunted
                             # Mines' (380 px tall) 54 px off the bottom (user, 2026-10-09: no
                             # jitter - decide at its QA). Was 1133.
floor = 1065                 # THE FLOOR, every map (user, 2026-10-09): no map's VISUAL bottom edge -
                             # the map art's outline, not its texture box nor the unit icons hanging
                             # off it (but the map's own markers, a building's or a camp's: user,
                             # 2026-10-14, Tomb's cut off) - may sit lower than Cursed Hollow's, the baseline: measured at
                             # 1080p, its interior to 1063, its outline ~1065. Check it when tuning a
                             # map ([minimap.nudge]); the build doesn't (each map's art ends short of
                             # its texture box by its own amount: Cursed Hollow's by ~15 px).
alert_gap = 10               # THE GAP, every map (user, 2026-10-14): a neutral objective above the minimap
                             # (Alterac's cage, Hanamura's payload) sits with its hexagon's bottom this many px
                             # over the drawn map's top tip - the hexagon, not its lowest part: what hangs under it
                             # goes either side of the tip (user, 2026-10-15). Each such map's measure is tools/maps.py
                             # `above`; gen.py moves its panels to it (panel_nudges) - not [minimap.panel_nudge].

# px per map, added to where tools/maps.py puts it: + lowers that map, - raises it. For fine
# tuning in game; 0 = its drawn bottom on the padding line. An older map without own_place in
# tools/maps.py doesn't move (see [minimap] bottom): its must stay 0 - tune its objective pieces
# ([minimap.panel_nudge]). Given own_place, it moves here from the start, by its map id.
[minimap.nudge]
alterac_pass = 0
battlefield_of_eternity = 16  # down to the floor (2026-10-15): its map's visual bottom (the outline's flat south edge) 1049 -> 1065
blackhearts_bay = 0
braxis_holdout = 18          # down to the floor (user, 2026-10-09): its map's visual bottom 1047 -> 1065; the HUD rides along
cursed_hollow = 0            # was 20 (its map's bottom on the screen's edge): [minimap] bottom now
dragon_shire = 0
garden_of_terror = 0
hanamura_temple = 18         # down to the floor (user, 2026-10-14): its map's visual bottom 1047 -> 1065; the objective rides along
haunted_mines = 34           # its whole map on the line (where it glides to when the mines open): its texture's opaque box is taller than the map - drawn, the mines' bottom was 34 above the line (2026-10-09)
infernal_shrines = 11        # down to the floor: its notch 1054 -> 1065. While the skull race shows it lifts
                             # out of the race's way ([minimap.lift]); was -39 for good (5099bf4), the floor's one exception
sky_temple = -22             # up to the floor (2026-10-15): its map's visual bottom (the south stub, off screen) ~1087 -> 1065
                             # (its top tip 788, its art 299 px tall); the temples ride along, at THE GAP (maps.py gap_parts)
tomb_of_the_spider_queen = 29 # down to the floor: its bottom marker (a building's, under the outline's ~1025) at
                             # ~1036 -> 1065. 40 put the outline there and cut the marker off (user, 2026-10-14)
towers_of_doom = 0
volskaya_foundry = 7          # down to the floor (user, 2026-10-15): its map's visual bottom (the outline's south stub) 1058 -> 1065
warhead_junction = 22         # down to the floor (user, 2026-10-15): its map's visual bottom (the outline's tip) 1043 -> 1065;
                             # the nuke counters beside it move out of its way (maps.py WARHEAD_COUNTERS_*)

# px per map that opens on part of its map (launch_cut in tools/maps.py): at load that part's
# bottom sits on the padding line, + lowers it. When the map opens in full it glides up to its
# [minimap.nudge] place and stays there.
[minimap.launch_nudge]
haunted_mines = 0            # the surface only, its bottom on the line; the mines below the screen (user, 2026-10-09)

# px per map that lifts its minimap out of a part's way while it shows (lifts in tools/maps.py):
# the minimap glides this far up from its [minimap.nudge] place, and back down when the part
# hides. The part stays put, where its panel hangs it with the map lifted.
[minimap.lift]
infernal_shrines = 50         # the skull race (counts' tops ~1032, crystal ~1012) covered the map's bottom on the
                             # floor: 50 up, its notch ~1015, cleared it (5099bf4; 60 too tall). Seen there for good first

# px per map: that map's objective panel (its counters, timers and banners), moved with the
# minimap as it sat round Blizzard's; + lowers it, - raises it.
[minimap.panel_nudge]
alterac_pass = 0             # placed by [minimap] alert_gap (was 10 down, user 2026-10-13)
battlefield_of_eternity = 0
blackhearts_bay = -30         # the doubloon counts' team line up to ~1070, level with Towers' (user, 2026-10-12:
                             # too low - the coins cut off by the screen's edge, their tops at 1052)
braxis_holdout = 24          # its zerg HUD above the map, 24 px down (user, 2026-10-09: 2, 2 more, then 20 once compacted)
cursed_hollow = -25          # the tribute counts' ravens ran off the bottom (user, 2026-10-06)
dragon_shire = -29           # its shrine markers' team line level with Towers' (~1070 at 1080p; user, 2026-10-09:
                             # off the screen at 0; -41 a bit high; -33 put the line at 1066)
garden_of_terror = -29       # the seed counts' team line up to ~1070, level with Blackheart's (user, 2026-10-12:
                             # the counts' tops at 1060, cut off by the screen's edge; Blackheart's at 1031)
hanamura_temple = 0          # placed by [minimap] alert_gap (26 here never moved it: maps.proxy_lines)
haunted_mines = -11          # the skull counts' skulls on the padding line, once the minimap has moved
                             # (user, 2026-10-09: they ran off the bottom; measured 8 px short, then the map's 34)
infernal_shrines = 20         # the skull counts' tops ~1050 (cut off by the edge) up to ~1031, as Garden's and Blackheart's -
                             # 19 up, and the minimap's 39 up taken back (it rides with it); the crystal rides with them.
                             # Counted with the map lifted: the race is pinned there ([minimap.lift])
sky_temple = 0
tomb_of_the_spider_queen = -58 # the gem counts on screen: their numbers' tops 1060 (cut off by the edge) up to ~1031, as
                             # Garden's - 29 up, and the minimap's 29 down taken back (seen at 1030 with -69 and 40)
towers_of_doom = 0
volskaya_foundry = 0
warhead_junction = 0

# ---------------------------------------------------------------------------
# Elements: rect = [x, y, width, height].
# kind: "ui"     drawn by the interface, always on
#       "obs"    left empty for OBS to fill
#       "demand" on demand, or temporary
# ---------------------------------------------------------------------------

# Top bar, blue side (outside in: score, name, logo, level). Red mirrors blue about x 960.
# OBS pass (user, 2026-09-30):
# - the top row (score, name, logo) is one band, the height of the level labels' backplate
#   wings: the top edge to y 63.3 (the hexagon's side points), so their art matches it;
# - logos are 8 px clear of the wings' slanted outer ends (762.4 / 1157.7 on the top edge);
#   blue's score stays clear of the replay panel (x 14-392, its art 20-386);
# - the second row: bans under each name; bracket (blue) and game count (red) under the
#   level labels, as wide as their wing's bottom edge (blue 794-890, red 1024-1126: Blizzard's
#   hexagon sits 2.75 px left of the screen's centre, so the wings differ).
[element.blue_score]
rect = [400, 0, 64, 63.3]
kind = "obs"
[element.blue_name]
rect = [470, 0, 214, 63.3]
kind = "ui"                  # the plate is ours; OBS draws the name on it
[element.blue_logo]
rect = [690, 0, 64, 63.3]
kind = "obs"
[element.blue_level]
rect = [800, 8, 80, 50]
kind = "ui"
[element.blue_talent_lead]
rect = [794, 0, 92, 64]      # Blizzard's flame, behind the level plate of the team ahead
kind = "demand"
[element.blue_bans]
rect = [576, 67, 108, 32]    # under the name, flush with its inner end
kind = "obs"
[element.bracket]
rect = [794, 67, 96, 24]     # under blue's wing
kind = "obs"

# Top bar, centre
[element.logo_plate]
rect = [892, 0, 136, 125]
kind = "ui"
[element.clock]
rect = [906, 128, 108, 32]
kind = "ui"

# Top bar, red side (inside out: level, logo, name, score)
[element.red_level]
rect = [1040, 8, 80, 50]
kind = "ui"
[element.red_talent_lead]
rect = [1034, 0, 92, 64]
kind = "demand"
[element.red_logo]
rect = [1166, 0, 64, 63.3]
kind = "obs"
[element.red_name]
rect = [1236, 0, 214, 63.3]
kind = "ui"
[element.red_score]
rect = [1456, 0, 64, 63.3]
kind = "obs"
[element.red_bans]
rect = [1236, 67, 108, 32]
kind = "obs"
[element.game_count]
rect = [1024, 67, 102, 24]   # under red's wing
kind = "obs"

# Around the edges
[element.replay]
rect = [1675, 14, 231, 153]  # Blizzard's ReplayPanel, 257 x 170 units (native 420 wide), in the
                             # top-right corner, its art [screen] padding from both edges; its
                             # tab (replay_collapsed) is flush in the corner (user, 2026-10-16;
                             # on red's row before, the inspect card's mirror, and narrowed then
                             # to clear red's map alerts).
                             # Its four buttons need 254 units (55 each, the ends 17 in); the
                             # rest is shared evenly between them (gen.py REPLAY_BUTTON_GAP): 1
                             # unit, so the ~9 px seen between buttons (each frame pads its box
                             # ~4 px) matches the ~9 px from the panel's edge to Pause.
                             # Was the right edge's middle 2026-10-06..16, native width.
art_inset = 6                # its glass art's outer line sits 6 px inside the frame on every side
                             # (measured in game, 2026-10-05)
kind = "ui"
[element.replay_collapsed]
rect = [1720, 0, 200, 24]    # hidden state: a slim tab flush in the screen's top-right corner
kind = "demand"
[element.kill_feed]
rect = [0, 104.4, 540, 300]  # Blizzard's, in its own place, not moved (user, 2026-10-05): top-left,
                             # under the party frame's top (150 - 34 units); rows grow right and
                             # down. Here only for the padding check and the canvas.
kind = "ui"
[element.info_pane]
rect = [20, 196, 494, 576]   # sized to the talents table: 23-unit margins either side of its
                             # rows (portrait at 23, last talent ending at 526 of 549 units) and
                             # just tall enough for its ten 60-unit rows under the title band.
                             # The stats panes spread their rows to fill the same box.
kind = "demand"

[element.inspect]
rect = [20, 0, 300, 525]     # the inspect card (selected hero): tall and skinny, left column;
                             # cut to what it holds (tools/inspect_card.py H: 583 units)
above = "blue_xp"            # its bottom sits [screen] padding above blue's row (its y is worked out)
kind = "demand"
neutral_colour = "b4a5e6"    # the card's edge for a unit of neither team (a mercenary camp, a
                             # boss): a lighter purple (user, 2026-10-05); blue and red are the plates'.
                             # Anything not a hero gets a short card (tools/inspect_card.py H_SHORT)

# The operator's toggles (user, 2026-10-16): just the four we care about, each Ctrl+Shift and
# the thing's initial, none of them a Blizzard key (validate.py checks every key here and the
# info panes' against Blizzard's game hotkeys, and against each other). Each starts on.
# Ahli and Spazzo have dozens; Blizzard has none of these four that works for an observer.
[toggles]
replay = "Control+Shift+R"   # the replay box (Blizzard's toggle, FCJH_Replay). Blizzard gave it
                             # Ctrl+Shift+O, which the game's UI editor's Save All takes first
                             # (gamehotkeys.txt), so it never worked - nor Ahli's (user,
                             # 2026-10-16). Moving Save All off it with our own GameHotkeys.txt
                             # didn't load (2026-10-16). The box's tab says the key too.
chat = "Control+Shift+C"     # Blizzard's chat messages (FCJH_Toggles); Ahli's key too
inspect = "Control+Shift+I"  # the inspect card (inspect_card.py); off, it waits off screen, as
                             # Ahli's does. Tried on Ctrl+I 2026-10-05 and dropped then.
names = "Control+Shift+N"    # the player names over the heroes' health bars (FCJH_Toggles)

[info_pane]
title_height = 26            # the title band across the top of the pane
border = 2                   # the frame line around it
header_height = 22           # the stats panes' column headings, under the title
team_height = 24             # each team's band (name + team totals) above its five rows
# Each pane has its own hotkey and starts hidden; they share the one info_pane box, and
# opening one closes whichever is open. Ctrl+1-4 (user, 2026-10-05): Blizzard's own panes on
# Ctrl+1 / Ctrl+2 have their keys taken away (FCJH_Hidden), as Ahli does.
hotkeys = { talents = "Control+1", kda = "Control+2", healing = "Control+3", structures = "Control+4" }
[element.centre_banners]
rect = [640, 196, 640, 78]   # Blizzard's; untouched, may shift on y
kind = "ui"

# Bottom centre
[element.map_objectives]
rect = [745, 742, 430, 56]
kind = "demand"
[element.minimap]
rect = [765, 804, 390, 264]
kind = "ui"

# ---------------------------------------------------------------------------
# Hero row. Ten cells, reading 1-5 (blue, left to right) then 6-0 (red).
# ---------------------------------------------------------------------------
[hero_row]
# Each hero cell is Blizzard's IN-GAME top-bar cell, same art and stacking: neighbours
# overlap so the slanted frames interlock. The cell's shape lives in tools/gen.py (HeroCell);
# here it's only scaled and placed. At scale 1 a cell is 115 x 55 px and a row of five is
# 468 px wide; at 1.375, 158 x 76 and 644; at 1.5125, 175 x 83 and 707.
# The rows are placed by their INNER ends (beside the minimap) and their bottom edge, so a new
# scale grows them outward and upward; tools/gen.py works out their top and blue's left edge.
# 1.375 = the mock's +10% (user, 2026-09-29); 1.5125 = another +10% (user, 2026-09-30).
# "fit" (2026-10-05): as large as [screen] padding allows - the rows' outer ends (their XP
# bars) that far from the screen's sides, and their bottom edge that far from its bottom.
scale = "fit"
blue_right = 752             # where blue's row ends (cell 5's right)
red_left = 1167              # cell 6; cells 7-0 follow to the right
talent_popup_size = 40       # the pop-ups' square (talent icon, heal plus), straddling the cell's top edge; shows ~42 px with its border, as the talents pane's squares (user, 2026-10-02; was 44)

# Talent pop-ups (tools/gen.py talent_popups): the talent a player just picked, in the talent
# pane's team-coloured square, in the same spot and motion as the heal pop-ups (both from
# tools/gen.py popup_frame), drawn over them. It always plays out - no lock, no early exit
# on a death: it's important information for the commentators (user, 2026-09-30).
# Size: talent_popup_size above.
[talent_popup]
hold = 5.1                   # s fully shown (gone at 0.25 + hold + fade = 6.1 s, as the probe)
fade = 0.75                  # s to fade out at the end

# Heal pop-ups (tools/gen.py heal_popups): a green plus in a green square, in the talent
# pop-up's spot and motion, when a hero drops to `threshold` percent or less. Once per dip:
# it re-arms only on a healthy reading (above threshold) or a death, and a plate never fires
# twice within `lock` s however the health reading flickers. It leaves on its own after
# `hold` s (plus the fade), or fades out at once if the hero dies. Built on what nine probe
# rounds taught (2026-09-26..30): the hero's health percent is read as TEXT and flickers,
# and state logic mustn't wait on an animation-driven flag.
[heal_popup]
threshold = 25               # percent
clear_above = 30             # percent: a showing pop-up fades out at once above this (user polish, 2026-09-30)
hold = 2.75                  # s fully shown (the talent pop-up holds 5.35; user: heal lingered)
fade = 0.75                  # s to fade out at the end
death_fade = 0.35            # s to fade out when the hero dies
lock = 6.0                   # s after a pop-up fires before that plate can fire another (10 while it showed 6.1 s)
colour = "3cff5a"            # the plus and the border
shrink = 2                   # px smaller than the talent pop-up, same centre (user, 2026-10-02)
plus_scale = 1.2            # the plus art, drawn this much larger than the box (its art has a wide margin); 0.86 until 2026-09-30

# Top bar backplate (tools/gen.py top_backplate_texture): one texture behind Blizzard's
# hexagon - wings along the top edge out past each team level (element.blue_level /
# red_level), their ends climbing with the plates' lean, and the hexagon on its own neutral
# plate. Silver chrome rim; team colour strongest at the wings' outer ends, fading to a
# stock dark toward the hexagon; a hexagon lattice fading the same way. Variant C of the
# canvas study (user, 2026-09-30) - the look the rest of the UI will follow.
[top_backplate]
# Blizzard's hexagon frame (TopBarLogoOverlay) as it lands at 1920 x 1080, its outer edge
# measured at 6x from a screenshot, 2026-09-30: corners clockwise from top-left, screen px.
# Not regular - the top edge is wider than the bottom (a regular one left the padding thin
# at the top and uneven down the lower sides)
hexagon = [[920, 7.5], [990.8, 7.5], [1019.8, 63.3], [988.3, 119.2], [923.7, 119.2], [894.7, 63.3]]
padding = 4                  # the neutral plate round the hexagon
wing_margin = 6              # the wings run this far past the level plates' outer edges
# the plates' health bars' own blue and red (Blizzard's fill art, sampled in game 2026-09-30)
blue_colour = "5cbcec"
red_colour = "e75c79"
colour_alpha = 1.0
# how strong the colour is along each wing, [position, strength]: 0 beside the hexagon, 1 at
# the wing's outer end
fade = [[0, 0.0], [0.15, 0.0], [0.35, 0.45], [0.55, 0.85], [1, 1.0]]
stock = ["221930", "170f20"] # the dark the colour fades to (top, bottom)
plate = ["3a3350", "15101f"] # the hexagon's plate (top, bottom)
rim = ["f4f6fb", "aab3cc", "5b637f", "c9d0e2"]   # chrome, top to bottom (stops 0, .35, .6, 1)
rim_width = 2.5
sheen = 0.16                 # white across the top half
hex_px = 14                  # the lattice's hexagons, width on screen
lattice = 0.6                # the lattice's strength

# Bars stacked on each hero row, placed by tools/gen.py from [hero_row] so they follow it.
# Both are cut to the plates' slant: their ends continue the row's slanted outer edges.

# Team XP: on the plates' top edge, the full width of that edge.
[team_xp]
height = 8                   # the bar
gap = 1                      # between the bar and the plates' top edge (tight: one unit with the plates)
colour = "9a6cff"            # the fill, both teams (hex RGB)
track_colour = "0b0c14"      # the empty part
track_alpha = 220

# A team's map alerts: stacked on its side of the minimap, on its plates' inner end (tools/maps.py).
[map_alerts]
above_core = 10              # px from the core bar's top up to every banner's bar's bottom: one place
                             # on every map, whether the core bar shows or not (user, 2026-10-09:
                             # the core bar is taller than any pop-up; what hangs under a bar is
                             # ignored - the banners draw over the pop-ups). Across, the art starts
                             # (red) or ends (blue) where its team's row does: [hero_row] red_left,
                             # blue_right

# Core health: on top of the XP bar, at the row's inner end (toward the minimap). Its size
# is Blizzard's (237 x 27 units = 213 x 24 px, 39% of the XP bar), fixed; Blizzard shows it
# only when a core is taking damage.
[team_core]
gap = 1                      # between core and XP
blue_colour = "3f8cff"
red_colour = "ff4a5e"
track_colour = "0b0c14"
track_alpha = 220
