# A release per version tag: push `v1.0.1` (matching layout.toml's [meta] version) and this
# builds the interface from that commit, compressed (tools/pack.py --release), and publishes
# it as the release's one file. Generation and validation need Blizzard's UI extract
# (references/, not in the repo), so they run locally before tagging; here the committed
# interface/ is packed as it is. Its notes are docs/releases/v<version>.md, committed with
# the bump: interface changes only, never the studio's (the release ships the interface alone).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('layout.toml', 'rb'))['meta']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME, but layout.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          test -f "docs/releases/v$version.md" || { echo "no docs/releases/v$version.md"; exit 1; }

      - name: Build
        run: python tools/pack.py --release --no-generate --no-validate

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/v$VERSION/FCJ v$VERSION.StormInterface" \
            --title "FCJ v$VERSION" --notes-file "docs/releases/v$VERSION.md"
